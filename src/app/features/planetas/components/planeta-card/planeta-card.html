@let p = planeta();

<article class="flex h-full flex-col overflow-hidden rounded-xl border border-stone-200 bg-white shadow-sm">
  <div class="flex min-h-48 items-center justify-center bg-linear-to-b from-ki-100 to-ki-50 p-4">
    <img [src]="p.image" [alt]="p.name" loading="lazy" class="max-h-64 w-full object-contain" />
  </div>
  <div class="flex flex-1 flex-col gap-3 p-4">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <h2 class="text-lg font-semibold leading-tight">{{ p.name }}</h2>
      @if (p.isDestroyed) {
        <span class="rounded-full bg-red-100 px-2.5 py-1 text-xs font-semibold text-red-800">Destruido</span>
      }
    </div>
    <p class="text-sm leading-relaxed text-stone-600">{{ p.description }}</p>
  </div>
</article>
